name: Build and Deploy to GitHub Pages

on:
  # Rebuild when changes are pushed to the website repo itself
  push:
    branches: [main]

  # Rebuild daily at 06:00 UTC to pick up new plugins merged to ori-shared-platform
  schedule:
    - cron: '0 6 * * *'

  # Allow manual rebuilds from the Actions tab
  workflow_dispatch:

# Required for GitHub Pages OIDC deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Prevent overlapping deployments; let the latest run finish
concurrency:
  group: pages
  cancel-in-progress: false

# ---------------------------------------------------------------------------
jobs:
# ---------------------------------------------------------------------------

  build:
    runs-on: ubuntu-24.04
    env:
      HUGO_VERSION: 0.147.8

    steps:
      # 1. Check out the website repo (this repo), including the Blowfish submodule
      - name: Checkout website repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2. Fetch only the plugins/ directory from ori-shared-platform
      #    No token needed — ori-shared-platform is a public repo
      - name: Checkout plugin source (ori-shared-platform)
        uses: actions/checkout@v4
        with:
          repository: AcademySoftwareFoundation/ori-shared-platform
          path: _plugin-source
          sparse-checkout: |
            plugins

      # 3. Clear any previously committed or generated plugin directories,
      #    then populate content/plugins/ from ori-shared-platform.
      #    Plugins are organised by product: plugins/{product}/{plugin-name}/
      #    Only index.md and feature.* images are copied — no source code.
      - name: Sync plugin content into Hugo
        run: |
          set -euo pipefail
          PLUGIN_SRC="_plugin-source/plugins"
          PLUGIN_DEST="content/plugins"

          # Remove all plugin subdirectories, preserving _index.md
          find "$PLUGIN_DEST" -mindepth 1 -maxdepth 1 -type d -exec rm -rf {} +

          if [ ! -d "$PLUGIN_SRC" ]; then
            echo "No plugins/ directory found in ori-shared-platform — site will show zero plugins."
            exit 0
          fi

          plugin_count=0
          # Iterate product directories (e.g. OpenRV/, xStudio/)
          for product_dir in "$PLUGIN_SRC"/*/; do
            [ -d "$product_dir" ] || continue
            product_name=$(basename "$product_dir")

            # Iterate individual plugin directories within each product
            for plugin_dir in "$product_dir"/*/; do
              [ -d "$plugin_dir" ] || continue
              plugin_name=$(basename "$plugin_dir")
              dest="$PLUGIN_DEST/$plugin_name"

              if [ ! -f "$plugin_dir/index.md" ]; then
                echo "  SKIP $product_name/$plugin_name — no index.md found"
                continue
              fi

              mkdir -p "$dest"

              cp "$plugin_dir/index.md" "$dest/index.md"

              # Copy any feature image (feature.png, feature.jpg, feature.svg, etc.)
              for img in "$plugin_dir"feature.*; do
                if [ -f "$img" ]; then
                  cp "$img" "$dest/"
                  echo "  + $product_name/$plugin_name/$(basename "$img")"
                fi
              done

              echo "  OK $product_name/$plugin_name"
              plugin_count=$((plugin_count + 1))
            done
          done

          echo "Synced $plugin_count plugin(s) into $PLUGIN_DEST"

      # 4. Fetch GitHub metrics for each plugin and write data/github-metrics.json.
      #    Uses METRICS_GITHUB_PAT if set (5,000 req/hr); falls back to GITHUB_TOKEN
      #    (also authenticated, avoids the 60 req/hr unauthenticated limit).
      #    To add or extend the PAT: GitHub > Settings > Developer settings >
      #    Personal access tokens. A classic PAT with no scopes, or a fine-grained
      #    PAT with "Public repositories (read-only)", is sufficient.
      #    Add it as secret METRICS_GITHUB_PAT in this repo's Settings > Secrets.
      - name: Fetch GitHub metrics
        env:
          GH_TOKEN: ${{ secrets.METRICS_GITHUB_PAT || github.token }}
        run: |
          python3 - << 'PYEOF'
          import os, json, re, urllib.request, urllib.error
          from datetime import datetime, timezone

          def updated_label(pushed_at_str):
              if not pushed_at_str:
                  return ""
              pushed_at = datetime.fromisoformat(pushed_at_str.replace("Z", "+00:00"))
              days = (datetime.now(timezone.utc) - pushed_at).days
              if days == 0:   return "today"
              if days == 1:   return "1 day ago"
              if days < 30:   return f"{days} days ago"
              if days < 365:
                  m = days // 30
                  return f"{m} month{'s' if m > 1 else ''} ago"
              y = days // 365
              return f"{y} year{'s' if y > 1 else ''} ago"

          token = os.environ.get("GH_TOKEN", "")
          headers = {"Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"}
          if token:
              headers["Authorization"] = f"Bearer {token}"

          metrics = {}
          plugins_dir = "content/plugins"

          for plugin_name in sorted(os.listdir(plugins_dir)):
              index_path = os.path.join(plugins_dir, plugin_name, "index.md")
              if not os.path.isfile(index_path):
                  continue
              with open(index_path) as f:
                  content = f.read()
              m = re.search(r'repoUrl\s*=\s*"(https://github\.com/[^"]+)"', content)
              if not m:
                  print(f"  SKIP {plugin_name} — no repoUrl in frontmatter")
                  continue
              repo_url = m.group(1).rstrip("/")
              owner_repo = repo_url.replace("https://github.com/", "")
              api_url = f"https://api.github.com/repos/{owner_repo}"
              try:
                  req = urllib.request.Request(api_url, headers=headers)
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      data = json.loads(resp.read())
                  pushed_at = data.get("pushed_at", "")
                  metrics[plugin_name] = {
                      "stars":        data.get("stargazers_count", 0),
                      "forks":        data.get("forks_count", 0),
                      "repoUrl":      repo_url,
                      "pushedAt":     pushed_at,
                      "updatedLabel": updated_label(pushed_at),
                  }
                  print(f"  OK  {plugin_name}: {metrics[plugin_name]['stars']}★  {metrics[plugin_name]['forks']}⑂  {metrics[plugin_name]['updatedLabel']}")
              except Exception as e:
                  print(f"  ERR {plugin_name}: {e}")
                  metrics[plugin_name] = {"stars": 0, "forks": 0, "repoUrl": repo_url, "pushedAt": "", "updatedLabel": ""}

          os.makedirs("data", exist_ok=True)
          with open("data/github-metrics.json", "w") as f:
              json.dump(metrics, f, indent=2)
          print(f"Wrote metrics for {len(metrics)} plugin(s) → data/github-metrics.json")
          PYEOF

      # 5. Install Hugo extended (required for CSS/SCSS processing)
      - name: Install Hugo
        run: |
          wget -q -O /tmp/hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i /tmp/hugo.deb
          hugo version

      # 6. Build the site
      #    --buildFuture: include pages whose `date` is ahead of the build timestamp.
      #    Needed because plugin submitters may use a future-dated frontmatter date.
      - name: Build site
        run: hugo --minify --buildFuture

      # 7. Package the built site for GitHub Pages deployment
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/

  # ---------------------------------------------------------------------------
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
